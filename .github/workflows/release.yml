name: Build & Package Installer (APK)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug or release)'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - release
          - both
  push:
    tags:
      - 'v*'

jobs:
  build-apk:
    name: Build Android Installer APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Strict Privacy Check (Verify NO INTERNET Permission)
        run: |
          echo "Checking AndroidManifest.xml for internet permission..."
          if grep -i "android.permission.INTERNET" app/src/main/AndroidManifest.xml; then
            echo "ERROR: INTERNET permission found! Violation of LOR TO-DO principles."
            exit 1
          fi
          echo "Verified: App is 100% offline with zero internet permission."

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' || github.event_name == 'push' }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Build Release APK
        if: ${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' || github.event_name == 'push' }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload Debug Installer (APK)
        if: ${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' || github.event_name == 'push' }}
        uses: actions/upload-artifact@v4
        with:
          name: LOR-TODO-debug.apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release Installer (APK)
        if: ${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' || github.event_name == 'push' }}
        uses: actions/upload-artifact@v4
        with:
          name: LOR-TODO-release-unsigned.apk
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release with Installer APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
