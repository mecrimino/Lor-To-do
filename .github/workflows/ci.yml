name: LOR TO-DO CI

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-verify:
    name: Build, Test & Privacy Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify NO Internet Permission (Privacy Enforcement)
        run: |
          echo "Verifying that android.permission.INTERNET is never requested..."
          if grep -i "android.permission.INTERNET" app/src/main/AndroidManifest.xml; then
            echo "ERROR: INTERNET permission found in AndroidManifest.xml! This violates LOR TO-DO principles."
            exit 1
          fi
          echo "Privacy check passed: App has zero internet permissions."

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew || true

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
